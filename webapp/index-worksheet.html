<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Pop Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@500;600&display=swap');

  :root {
    --paper: #FBF7EE;
    --paper-shadow: #E4DBC6;
    --rule: #D8CFC0;
    --ink: #1F2A44;
    --pencil: #6B7280;
    --red-pen: #B23A2E;
    --green-pen: #2F6F4E;
    --highlight: #F5E6A8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #DED3B8;
    background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.06) 1px, transparent 0);
    background-size: 14px 14px;
    display: flex;
    justify-content: center;
    padding: 56px 20px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  .sheet {
    width: 100%;
    max-width: 600px;
    background: var(--paper);
    position: relative;
    padding: 44px 40px 40px 64px;
    box-shadow: 0 24px 50px rgba(0,0,0,0.18), 0 2px 0 var(--paper-shadow);
  }

  /* torn perforated top edge */
  .sheet::before {
    content: '';
    position: absolute;
    top: -8px; left: 0; right: 0;
    height: 16px;
    background: repeating-linear-gradient(
      -45deg, var(--paper) 0 6px, transparent 6px 12px
    );
    background-color: transparent;
    mask: linear-gradient(#000 0 0);
  }

  .sheet {
    clip-path: polygon(
      0% 1.5%, 3% 0%, 6% 1.8%, 9% 0.3%, 12% 1.6%, 15% 0.2%, 18% 1.7%,
      21% 0.4%, 24% 1.5%, 27% 0.1%, 30% 1.8%, 33% 0.3%, 36% 1.6%,
      39% 0.2%, 42% 1.7%, 45% 0.4%, 48% 1.5%, 51% 0.1%, 54% 1.8%,
      57% 0.3%, 60% 1.6%, 63% 0.2%, 66% 1.7%, 69% 0.4%, 72% 1.5%,
      75% 0.1%, 78% 1.8%, 81% 0.3%, 84% 1.6%, 87% 0.2%, 90% 1.7%,
      93% 0.4%, 96% 1.5%, 100% 0.5%,
      100% 100%, 0% 100%
    );
  }

  /* spiral binding holes */
  .sheet::after {
    content: '';
    position: absolute;
    top: 20px; bottom: 20px; left: 24px;
    width: 14px;
    background-image: radial-gradient(circle, #DED3B8 5px, transparent 5.5px);
    background-size: 14px 34px;
    background-repeat: repeat-y;
  }

  .letterhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1.5px solid var(--rule);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }

  .letterhead h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0;
  }

  .letterhead .subject {
    font-size: 12px;
    color: var(--pencil);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .field-row {
    display: flex;
    gap: 24px;
    font-size: 13px;
    color: var(--pencil);
    margin-bottom: 26px;
  }

  .field-row .field { flex: 1; }
  .field-row .field-label { display: block; margin-bottom: 2px; }
  .field-row .field-value {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    color: var(--ink);
    border-bottom: 1px dashed var(--rule);
    padding-bottom: 2px;
    min-height: 24px;
  }

  input#playerName {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--rule);
    width: 100%;
    outline: none;
    padding-bottom: 2px;
  }

  button.primary {
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 11px 20px;
    cursor: pointer;
  }

  button.primary:hover { background: #14192b; }

  button.ghost {
    background: transparent;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 10px 18px;
    cursor: pointer;
  }

  .q-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--pencil);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .q-meta .score-tally {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: var(--red-pen);
    text-transform: none;
    letter-spacing: 0;
  }

  .question-text {
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    line-height: 1.4;
    margin: 0 0 20px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 8px;
  }

  .choice-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 6px;
    cursor: pointer;
    border: none;
    background: transparent;
    text-align: left;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    width: 100%;
  }

  .choice-row:hover:not(:disabled) { background: rgba(31,42,68,0.05); }
  .choice-row:disabled { cursor: default; }

  .letter-badge {
    position: relative;
    width: 26px;
    height: 26px;
    flex: none;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
  }

  .letter-badge svg {
    position: absolute;
    top: -7px; left: -7px;
    width: 40px;
    height: 40px;
    overflow: visible;
  }

  .choice-row.marked-correct .letter-badge { border-color: var(--green-pen); color: var(--green-pen); }
  .choice-row.marked-wrong .letter-badge { border-color: var(--red-pen); color: var(--red-pen); }

  .feedback {
    font-family: 'Caveat', cursive;
    font-size: 21px;
    min-height: 30px;
    margin: 6px 0 10px;
  }

  .feedback.correct { color: var(--green-pen); }
  .feedback.wrong { color: var(--red-pen); }

  .controls { display: flex; gap: 10px; margin-top: 10px; }

  hr.tear {
    border: none;
    border-top: 1.5px dashed var(--rule);
    margin: 34px -40px 34px -64px;
  }

  .final-grade {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 6px;
  }

  .final-grade .big {
    font-family: 'Caveat', cursive;
    font-size: 56px;
    color: var(--red-pen);
    line-height: 1;
    transform: rotate(-4deg);
    display: inline-block;
  }

  .final-note {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    color: var(--pencil);
    margin: 0 0 22px;
  }

  .leaderboard-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--pencil);
    margin: 0 0 10px;
  }

  .leaderboard {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .leaderboard li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 0;
    border-bottom: 1px dotted var(--rule);
    font-size: 14.5px;
  }
  .leaderboard li:last-child { border-bottom: none; }

  .leaderboard .rank {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: var(--red-pen);
    margin-right: 8px;
  }

  .leaderboard .pts {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: var(--green-pen);
  }

  .empty-note {
    color: var(--pencil);
    font-size: 13.5px;
    font-style: italic;
  }

  footer.stamp {
    text-align: center;
    font-size: 11px;
    color: var(--pencil);
    margin-top: 40px;
    letter-spacing: 0.03em;
  }

  @media (max-width: 480px) {
    .sheet { padding: 40px 22px 32px 44px; }
    .sheet::after { left: 12px; }
    hr.tear { margin: 28px -22px 28px -44px; }
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="letterhead">
    <h1>CS Pop Quiz</h1>
    <span class="subject">Computer Science</span>
  </div>

  <div id="setupView">
    <div class="field-row">
      <div class="field">
        <span class="field-label">Name</span>
        <input id="playerName" type="text" placeholder="write your name here" />
      </div>
      <div class="field">
        <span class="field-label">Score</span>
        <span class="field-value">— / 10</span>
      </div>
    </div>
    <button class="primary" id="startBtn">Begin quiz</button>
  </div>

  <div id="quizView" style="display:none;">
    <div class="q-meta">
      <span id="progress">Question 1 of 10</span>
      <span class="score-tally" id="scoreTally">0 correct</span>
    </div>
    <p class="question-text" id="questionText">Loading question…</p>
    <div class="choices" id="choices"></div>
    <p class="feedback" id="feedback"></p>
    <div class="controls">
      <button class="primary" id="nextBtn" style="display:none;">Next question →</button>
    </div>
  </div>

  <div id="doneView" style="display:none;">
    <div class="final-grade">
      <span class="big" id="finalScore">8/10</span>
      <span>nice work.</span>
    </div>
    <p class="final-note" id="finalNote"></p>
    <button class="ghost" id="restartBtn">Take it again</button>
  </div>

  <hr class="tear">

  <p class="leaderboard-title">Top scores</p>
  <ul class="leaderboard" id="leaderboardList">
    <li class="empty-note">Loading…</li>
  </ul>

  <footer class="stamp">served from a lambda function, graded by hand (well — javascript)</footer>
</div>

<script>
  const API_BASE = "https://rqb0puqcg5.execute-api.us-east-1.amazonaws.com/Prod";
  const LETTERS = ["A", "B", "C", "D", "E"];

  let questions = [];
  let currentIndex = 0;
  let playerId = "";
  let sessionScore = 0;

  const setupView = document.getElementById('setupView');
  const quizView = document.getElementById('quizView');
  const doneView = document.getElementById('doneView');
  const startBtn = document.getElementById('startBtn');
  const nextBtn = document.getElementById('nextBtn');
  const restartBtn = document.getElementById('restartBtn');
  const playerNameInput = document.getElementById('playerName');
  const choicesEl = document.getElementById('choices');
  const questionText = document.getElementById('questionText');
  const feedback = document.getElementById('feedback');
  const progress = document.getElementById('progress');
  const scoreTally = document.getElementById('scoreTally');
  const finalScore = document.getElementById('finalScore');
  const finalNote = document.getElementById('finalNote');
  const leaderboardList = document.getElementById('leaderboardList');

  function circleSvg() {
    return `<svg viewBox="0 0 40 40"><ellipse cx="20" cy="20" rx="17" ry="14"
      fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" transform="rotate(-6 20 20)" /></svg>`;
  }

  async function loadQuestions() {
    const res = await fetch(`${API_BASE}/quiz?limit=10`);
    const data = await res.json();
    questions = data.questions || [];
  }

  function renderQuestion() {
    const q = questions[currentIndex];
    if (!q) { showDone(); return; }

    progress.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
    questionText.textContent = q.question;
    feedback.textContent = "";
    feedback.className = "feedback";
    nextBtn.style.display = "none";

    choicesEl.innerHTML = "";
    (q.options || []).forEach((opt, i) => {
      const row = document.createElement('button');
      row.className = 'choice-row';
      row.innerHTML = `<span class="letter-badge">${LETTERS[i] || "?"}</span><span>${opt}</span>`;
      row.onclick = () => submitAnswer(opt, row);
      choicesEl.appendChild(row);
    });
  }

  async function submitAnswer(answer, rowEl) {
    const q = questions[currentIndex];
    document.querySelectorAll('.choice-row').forEach(b => b.disabled = true);

    const res = await fetch(`${API_BASE}/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_id: playerId, question_id: q.question_id, answer })
    });
    const data = await res.json();

    const badge = rowEl.querySelector('.letter-badge');
    badge.insertAdjacentHTML('beforeend', circleSvg());

    if (data.correct) {
      rowEl.classList.add('marked-correct');
      feedback.textContent = "✓ correct!";
      feedback.classList.add('correct');
      sessionScore += 1;
    } else {
      rowEl.classList.add('marked-wrong');
      feedback.textContent = `✗ nope — it was "${data.correct_answer}"`;
      feedback.classList.add('wrong');
    }
    scoreTally.textContent = `${sessionScore} correct`;
    nextBtn.style.display = "inline-block";
  }

  function showDone() {
    quizView.style.display = "none";
    doneView.style.display = "block";
    finalScore.textContent = `${sessionScore}/${questions.length}`;
    const pct = sessionScore / questions.length;
    finalNote.textContent = pct >= 0.8
      ? `Strong round, ${playerId}. You know your stuff.`
      : pct >= 0.5
      ? `Solid effort, ${playerId}. A few to review.`
      : `Rough one, ${playerId} — worth another attempt.`;
    saveRoundResult();
  }

  async function saveRoundResult() {
    try {
      const res = await fetch(`${API_BASE}/finish`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ player_id: playerId, score: sessionScore, total: questions.length })
      });
      const data = await res.json();
      if (data.is_new_best) {
        finalNote.textContent += " New personal best!";
      }
    } catch (e) {
      // non-fatal — leaderboard just won't reflect this round
    }
    loadLeaderboard();
  }

  async function loadLeaderboard() {
    try {
      const res = await fetch(`${API_BASE}/leaderboard`);
      const data = await res.json();
      const board = (data.leaderboard || []);
      if (!board.length) {
        leaderboardList.innerHTML = `<li class="empty-note">No scores yet — be the first.</li>`;
        return;
      }
      leaderboardList.innerHTML = board.map((p, i) =>
        `<li><span><span class="rank">${i+1}.</span>${p.player_id}</span><span class="pts">${p.score}/${p.total ?? '10'}</span></li>`
      ).join('');
    } catch (e) {
      leaderboardList.innerHTML = `<li class="empty-note">Couldn't load scores right now.</li>`;
    }
  }

  startBtn.onclick = async () => {
    const name = playerNameInput.value.trim();
    if (!name) { playerNameInput.focus(); return; }
    playerId = name;
    sessionScore = 0;
    currentIndex = 0;
    setupView.style.display = "none";
    quizView.style.display = "block";
    questionText.textContent = "Loading question…";
    choicesEl.innerHTML = "";
    scoreTally.textContent = "0 correct";
    await loadQuestions();
    if (!questions.length) {
      questionText.textContent = "No questions in the bank yet — run POST /import first.";
      return;
    }
    renderQuestion();
  };

  nextBtn.onclick = () => {
    currentIndex += 1;
    renderQuestion();
  };

  restartBtn.onclick = () => {
    doneView.style.display = "none";
    setupView.style.display = "block";
    playerNameInput.value = "";
  };

  loadLeaderboard();
</script>
</body>
</html>
